name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}, OpenMP ${{ matrix.config.openmp }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, openmp: 'yes', manual: true}
          - {os: ubuntu-latest, r: devel, openmp: 'yes', http-user-agent: release}
          - {os: ubuntu-latest, r: oldrel-1, openmp: 'yes'}
          - {os: ubuntu-latest, r: release, openmp: 'no'}
          - {os: macos-latest, r: release, openmp: 'no'}
          - {os: macos-15-intel, r: release, openmp: 'no'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      RRAD_OPENMP: ${{ matrix.config.openmp }}
      # Keep checks reproducible and below the CRAN check farm's CPU limit.
      OMP_THREAD_LIMIT: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      - name: Install PDF manual fonts
        if: matrix.config.manual
        run: |
          tlmgr update --self
          tlmgr install inconsolata helvetic times courier ec

      - name: Verify vendored source provenance
        shell: Rscript {0}
        run: |
          testthat::test_file("tests/testthat/test-rad-provenance.R",
                              stop_on_failure = TRUE)

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: ${{ matrix.config.manual && 'character()' || 'c("--no-manual")' }}
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--as-cran", "--no-manual")' }}
          error-on: '"warning"'
          upload-snapshots: true
          upload-results: true
