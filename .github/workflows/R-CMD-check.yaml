name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}, OpenMP ${{ matrix.config.openmp }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, openmp: 'yes', manual: true}
          - {os: ubuntu-latest, r: devel, openmp: 'yes', http-user-agent: release}
          - {os: ubuntu-latest, r: oldrel-1, openmp: 'yes'}
          - {os: ubuntu-latest, r: release, openmp: 'no'}
          - {os: ubuntu-24.04-arm, r: release, openmp: 'yes'}
          - {os: macos-latest, r: release, openmp: 'no'}
          - {os: macos-15-intel, r: release, openmp: 'no'}
          - {os: macos-latest, r: release, openmp: 'yes', xcode: '26.3'}
          - {os: macos-15-intel, r: release, openmp: 'yes'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      RRAD_OPENMP: ${{ matrix.config.openmp }}
      # Keep checks reproducible and below the CRAN check farm's CPU limit.
      OMP_THREAD_LIMIT: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v6

      - name: Prefer responsive Ubuntu mirrors
        if: runner.os == 'Linux'
        run: |
          # Keep Ubuntu's security mirror, suites, and signing keys; only
          # reprioritize the official archive ahead of the Azure mirror.
          # See actions/runner-images/images/ubuntu/scripts/build/configure-apt-sources.sh.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i \
              -e 's|^http://azure\.archive\.ubuntu\.com/ubuntu/\(.*\)priority:1$|http://azure.archive.ubuntu.com/ubuntu/\1priority:2|' \
              -e 's|^https://archive\.ubuntu\.com/ubuntu/\(.*\)priority:2$|https://archive.ubuntu.com/ubuntu/\1priority:1|' \
              /etc/apt/apt-mirrors.txt
          fi
          # Match current runner-image failover limits rather than waiting
          # minutes per stalled download: https://github.com/actions/runner-images/issues/14594
          sudo tee /etc/apt/apt.conf.d/zz-rrad-network >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Configure explicit macOS OpenMP toolchain
        if: runner.os == 'macOS' && matrix.config.openmp == 'yes'
        shell: bash
        env:
          RRAD_XCODE_VERSION: ${{ matrix.config.xcode }}
        run: |
          # Match Apple's compiler to the signed R-project runtime:
          # https://mac.r-project.org/openmp/
          # Latest runners also contain this supported Xcode release; their
          # newer default compiler is still exercised by the serial job.
          if [[ -n "$RRAD_XCODE_VERSION" ]]; then
            export DEVELOPER_DIR="/Applications/Xcode_${RRAD_XCODE_VERSION}.app/Contents/Developer"
            test -d "$DEVELOPER_DIR"
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          clang --version
          clang_build="$(clang --version | sed -n 's/.*clang-\([0-9]*\).*/\1/p' | head -n 1)"
          case "$clang_build" in
            1700*) omp_version=19.1.5; omp_sha1=5b44175bcbaa334b0c57391482e068ea185c95a2 ;;
            1600*) omp_version=17.0.6; omp_sha1=a89cab4e763025f03a5d12a93a609ff771ad209c ;;
            1500*) omp_version=16.0.4; omp_sha1=591136d3c1cc26f3a21f1202a652be911bf1a2ad ;;
            *) echo "No verified OpenMP runtime configured for Apple clang $clang_build" >&2; exit 1 ;;
          esac
          omp_dir="$RUNNER_TEMP/rrad-openmp"
          mkdir -p "$omp_dir"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "https://mac.r-project.org/openmp/openmp-${omp_version}-darwin20-Release.tar.gz" \
            -o "$omp_dir/runtime.tar.gz"
          echo "$omp_sha1  $omp_dir/runtime.tar.gz" | shasum -a 1 -c -
          tar -xzf "$omp_dir/runtime.tar.gz" -C "$omp_dir"
          codesign --verify "$omp_dir/usr/local/lib/libomp.dylib"
          rrad_r_home="$(R RHOME)"
          # Use one shared runtime in the ephemeral runner's R installation.
          # This avoids loading both CRAN R's runtime and a second copy.
          sudo cp "$omp_dir/usr/local/lib/libomp.dylib" "$rrad_r_home/lib/libomp.dylib"
          # The downloaded library's install name is /usr/local/lib/libomp.dylib.
          # Resolve that name to the same runtime, rather than installing a copy.
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$rrad_r_home/lib/libomp.dylib" /usr/local/lib/libomp.dylib
          cat > "$omp_dir/Makevars" <<EOF
          SHLIB_OPENMP_CXXFLAGS = -Xclang -fopenmp
          CPPFLAGS += -I$omp_dir/usr/local/include
          LDFLAGS += -Wl,-rpath,$rrad_r_home/lib $rrad_r_home/lib/libomp.dylib
          EOF
          echo "R_MAKEVARS_USER=$omp_dir/Makevars" >> "$GITHUB_ENV"
          echo "RRAD_NATIVE_FLAGS=-Xclang -fopenmp -I$omp_dir/usr/local/include" >> "$GITHUB_ENV"
          echo "RRAD_NATIVE_LIBS=-Wl,-rpath,$rrad_r_home/lib $rrad_r_home/lib/libomp.dylib" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      - name: Install manual validation tools and fonts
        if: matrix.config.manual
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tidy
          tlmgr update --self
          tlmgr install inconsolata helvetic times courier ec

      - name: Verify vendored source provenance
        shell: Rscript {0}
        run: |
          testthat::test_file("tests/testthat/test-rad-provenance.R",
                              stop_on_failure = TRUE)

      - name: Run native regression suites
        if: matrix.config.r == 'release'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux && "$RRAD_OPENMP" == yes ]]; then
            export RRAD_NATIVE_FLAGS=-fopenmp
          fi
          bash tests/native/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/rrad-native.log"

      - uses: actions/upload-artifact@v4
        if: always() && matrix.config.r == 'release'
        with:
          name: native-${{ matrix.config.os }}-openmp-${{ matrix.config.openmp }}
          path: ${{ runner.temp }}/rrad-native.log
          if-no-files-found: error

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: ${{ matrix.config.manual && 'character()' || 'c("--no-manual")' }}
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--as-cran", "--no-manual")' }}
          error-on: '"warning"'
          upload-snapshots: true
          upload-results: true

  native-sanitizers:
    name: Linux native address and undefined-behavior checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_THREAD_LIMIT: '2'
      OMP_NUM_THREADS: '2'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      RRAD_NATIVE_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v6

      - name: Prefer responsive Ubuntu mirrors
        if: runner.os == 'Linux'
        run: |
          # Keep Ubuntu's security mirror, suites, and signing keys; only
          # reprioritize the official archive ahead of the Azure mirror.
          # See actions/runner-images/images/ubuntu/scripts/build/configure-apt-sources.sh.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i \
              -e 's|^http://azure\.archive\.ubuntu\.com/ubuntu/\(.*\)priority:1$|http://azure.archive.ubuntu.com/ubuntu/\1priority:2|' \
              -e 's|^https://archive\.ubuntu\.com/ubuntu/\(.*\)priority:2$|https://archive.ubuntu.com/ubuntu/\1priority:1|' \
              /etc/apt/apt-mirrors.txt
          fi
          # Match current runner-image failover limits rather than waiting
          # minutes per stalled download: https://github.com/actions/runner-images/issues/14594
          sudo tee /etc/apt/apt.conf.d/zz-rrad-network >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install native-test headers
        shell: Rscript {0}
        run: install.packages("BH")

      - name: Run instrumented native regression suites
        shell: bash
        run: bash tests/native/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/rrad-native-sanitizers.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sanitizers-linux
          path: ${{ runner.temp }}/rrad-native-sanitizers.log
          if-no-files-found: error
